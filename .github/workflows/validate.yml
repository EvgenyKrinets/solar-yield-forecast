name: Validate integration
on:
  push:
  pull_request:
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Custom-repository installation does not require catalog metadata.
          # Remove these ignores before applying to the HACS default catalog.
          ignore: description topics
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q custom_components/solar_yield_forecast
      - run: pip install pytest
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_card.cjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
